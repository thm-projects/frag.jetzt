# Required metadata - Basic information about the project
sonar.projectKey=frag.jetzt-frontend      # Unique identifier for the project in SonarQube
sonar.projectName=frag.jetzt Frontend     # Display name of the project in SonarQube dashboard
sonar.projectVersion=3.0                  # Version number of the project being analyzed
sonar.language=ts                         # Primary language of the project (TypeScript)
sonar.sources=./src                       # Directory containing the source code to analyze
sonar.exclusions=dist/**/*, node_modules/**/*, **/*.spec.ts  # Patterns for files to exclude from analysis
sonar.sourceEncoding=UTF-8                # Character encoding of the source files
sonar.tests=./src                         # Directory containing test files
sonar.test.inclusions=**/*.spec.ts        # Pattern to identify test files within the project
sonar.host.url=http://sonarqube:9000      # URL of the SonarQube server
sonar.typescript.lcov.reportPaths=coverage/lcov.info  # Path to the test coverage report

# Ignore all deprecated warnings across the entire project
sonar.issue.ignore.multicriteria=1        # Enables custom issue filtering (1 rule defined)
sonar.issue.ignore.multicriteria.1.ruleKey=typescript:S1133  # Rule ID for '@deprecated' usage warnings
sonar.issue.ignore.multicriteria.1.resourceKey=**/*  # Apply to all files in the project (global pattern)
