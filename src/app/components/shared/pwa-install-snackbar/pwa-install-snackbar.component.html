<div class="snackbar-container">
  <div class="pwa-snackbar-content">
    <mat-icon
      svgIcon="fj_robot"
      class="robot-icon"></mat-icon>
    <span>{{ getInstallPrompt() }}</span>
  </div>
  <div class="snackbar-actions">
    <button
      *ngIf="supportsDirectInstall()"
      mat-flat-button
      color="accent"
      (click)="install()">
      {{ i18n().installButton }}
    </button>
    <button
      mat-button
      [color]="supportsDirectInstall() ? null : 'accent'"
      class="later-button"
      (click)="dismiss()">
      {{ i18n().laterButton }}
    </button>
  </div>
</div>
