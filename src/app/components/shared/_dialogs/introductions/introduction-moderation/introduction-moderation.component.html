<h2
  tabindex="0"
  mat-dialog-title>
  {{ "introductions.moderation-title" | translate }}
</h2>

<mat-dialog-content tabindex="0">
  @switch (language()) {
    @case ("de") {
      <app-introduction-moderation-de></app-introduction-moderation-de>
    }
    @case ("fr") {
      <app-introduction-moderation-fr></app-introduction-moderation-fr>
    }
    @default {
      <app-introduction-moderation-en></app-introduction-moderation-en>
    }
  }
</mat-dialog-content>

<mat-dialog-actions>
  <button
    mat-button
    class="primary-button"
    mat-dialog-close>
    {{ "introductions.cancel" | translate }}
  </button>
</mat-dialog-actions>
