<h2 mat-dialog-title>
  {{ i18n().title }}
</h2>

<mat-dialog-content>
  <mat-form-field>
    <mat-label>{{ i18n().name }}</mat-label>
    <input
      #pseudonymInput
      matInput
      [formControl]="questionerNameFormControl"
      aria-label="Pseudonym" />
    <button
      mat-icon-button
      matSuffix
      *ngIf="questionerNameFormControl.value"
      (click)="clearInput()"
      aria-label="Clear input">
      <mat-icon>close</mat-icon>
    </button>
    <mat-error *ngIf="questionerNameFormControl.hasError('required')">
      {{ i18n().requiredError }}
    </mat-error>
    <mat-error *ngIf="questionerNameFormControl.hasError('pattern')">
      {{ i18n().name }} {{ i18n().error }}
    </mat-error>
    <mat-error
      *ngIf="
        questionerNameFormControl.hasError('minlength') ||
        questionerNameFormControl.hasError('maxlength')
      ">
      {{
        replaceI18n(i18n().nameLengthError, {
          min: questionerNameMin,
          max: questionerNameMax,
        })
      }}
    </mat-error>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions>
  <button
    mat-button
    mat-dialog-close>
    {{ i18n().global.cancel }}
  </button>
  <button
    mat-button
    color="warn"
    (click)="deletePseudonym()"
    [disabled]="
      !questionerNameFormControl.value ||
      questionerNameFormControl.value.trim() === ''
    ">
    {{ i18n().global.delete }}
  </button>
  <span style="flex: 1"></span>
  <button
    mat-button
    color="primary"
    (click)="accept()"
    [disabled]="isSaveDisabled">
    {{ i18n().global.saveAndClose }}
  </button>
</mat-dialog-actions>
