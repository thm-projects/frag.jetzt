<mat-card appearance="outlined">
  <!-- Page Title -->
  <h1>{{ "mailing.title" | translate }}</h1>

  <!-- Subject Input Field -->
  <mat-form-field>
    <mat-label>{{ "mailing.subject" | translate }}</mat-label>
    <input
      appAccessibilityEscapedInput
      matInput
      [(ngModel)]="subject"
      [placeholder]="'mailing.placeholder-subject' | translate" />
  </mat-form-field>

  <!-- Message Body Text Area -->
  <mat-form-field>
    <mat-label>{{ "mailing.body" | translate }}</mat-label>
    <textarea
      appAccessibilityEscapedInput
      matInput
      rows="10"
      [(ngModel)]="message"
      [placeholder]="'mailing.placeholder-body' | translate"></textarea>
  </mat-form-field>

  <!-- Send Button - Disabled when fields are empty -->
  <button
    mat-flat-button
    color="primary"
    [disabled]="!subject?.trim() || !message?.trim()"
    (click)="send()">
    {{ "mailing.send" | translate }}
  </button>
</mat-card>
